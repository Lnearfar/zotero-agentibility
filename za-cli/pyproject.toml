[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "za-cli"
version = "0.4.1"
description = "Local-first Linux CLI for a Zotero research library"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
dependencies = [
    "chromadb>=1.5,<2",
    "click>=8.1,<9",
]

[project.scripts]
za-cli = "za_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["za_cli*"]
